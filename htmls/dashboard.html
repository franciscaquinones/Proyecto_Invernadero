<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="../imgs/Logo_Pub.png">
    <link rel="stylesheet" href="../csss/Estilo_Interno.css">
    <link rel="stylesheet" href="../csss/Dashboard.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="../jss/Dashboard.js"></script>
    <script type="module" src="../jss/main.js"></script>
    <title>
        Inicio - Umbrella Corps Botanics
    </title>
    <!-- Autores: Francisca Quiñones y Oscar Oviedo -->
    <!-- Proyecto Arklay Botanics -->
</head>
<body data-rol="usuario">

    <header>

        <div id="Logo">
            <img src="../imgs/Logo_Pub.png" id="Logo_Pub" />
            <h1>
                Umbrella Corps Botanics
            </h1>
        </div>

        <table>
            <tr>
                <td>
                    <a href="perfil.html" data-nombre-usuario>
                        Usuario
                    </a>
                </td>
                <td>
                    <a href="login.html" data-cerrar-sesion>
                        Cerrar Sesión
                    </a>
                </td>
            </tr>
        </table>

    </header>
    <p id="Mensaje_Sesion" role="status"></p>
    <button type="button" id="Reintentar_Sesion" hidden>Reintentar</button>
    <nav>

        <a href="dashboard.html" id="Activo">
            Inicio
        </a>
        <a href="cultivos.html">
            Cultivos
        </a>
        <a href="sensores.html">
            Sensores
        </a>
        <a href="historial.html">
            Historial
        </a>

    </nav>

    <main hidden x-data="resumenDashboard" x-init="cargarResumen()">

        <section id="Resumen">

            <h2>Bienvenido al Panel Principal:</h2>

            <div class="Estado_Resumen" x-show="cargando || errorCarga">
                <p x-show="cargando" role="status">Cargando resumen...</p>
                <p x-show="errorCarga" x-text="errorCarga" role="alert" x-cloak></p>
                <button type="button" x-show="errorCarga && !cargando" @click="cargarResumen()" x-cloak>
                    Reintentar
                </button>
            </div>
            <template x-if="resumen">
                <article>
                    <h3>Cantidad Total de Cultivos</h3>
                    <p x-text="resumen.totalCultivos"></p>
                </article>
            </template>
            <template x-if="resumen">
                <article>
                    <h3>Cantidad Total de Sensores</h3>
                    <p x-text="resumen.totalSensores"></p>
                </article>
            </template>
            <template x-if="resumen">
                <article>
                    <h3>Cantidad Total de Registros</h3>
                    <p x-text="resumen.totalRegistros"></p>
                </article>
            </template>
            <template x-if="resumen">
                <p class="Estado_Resumen" x-show="resumen.totalCultivos === 0 && resumen.totalSensores === 0 && resumen.totalRegistros === 0">
                    Tu invernadero todavía no tiene cultivos, sensores ni registros.
                </p>
            </template>
        </section>
        <br>
        <br>
        <template x-if="resumen">
            <section id="Actividad">

                <h2>Actividad Reciente</h2>
                <p>Últimas mediciones registradas por tus sensores.</p>
                <p x-show="resumen.actividadReciente.length === 0">
                    Todavía no tienes mediciones registradas.
                </p>
                <ul>
                    <template x-for="Registro in resumen.actividadReciente" :key="Registro.id">
                        <li>
                            <strong x-text="'Sensor ' + Registro.sensorId"></strong>
                            <span> · Medición registrada el </span>
                            <span x-text="Registro.fecha"></span>
                            <span> a las </span>
                            <span x-text="Registro.hora"></span>
                        </li>
                    </template>
                </ul>
                <a href="historial.html" class="Boton_Historial">Consultar historial</a>
            </section>
        </template>
    </main>
    <hr>
    <footer>

        <h3>
            Autores: Oscar Oviedo y Francisca Quiñones
            <br>
            Contacto: contacto@arklaybotanics.com
            <br>
            Página Oficial: www.stellawings.com
            <br>
            Todos los derechos reservados ©
        </h3>

    </footer>

</body>

</html>
