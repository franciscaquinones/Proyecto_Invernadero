<!DOCTYPE html>
<html lang = "es">//la pagina va a estar en español
    <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">//para el celu
        <title>Iniciar Sesión</title>
    </head>
    <body>
        <header>
            <h1>Gestión de Invernadero</h1>
        </header>
        <main>
            <section>
                <h2>
                    Iniciar Sesión
                </h2>
                <form id="Form_Login">
                    <table>
                        <tr>
                            <th>Ingrese su correo electrónico</th>
                            <td>
                                <input
                                 type="email"
                                id="correo"
                                name="correo"
                                placeholder="nose@dominio.com">
                            </td>
                        </tr>
                        <tr>
                            <th>
                                Ingrese su contraseña 
                            </th>
                            <td>
                                <input
                                type="password"
                                id="contraseña"
                                name="contraseña"
                                placeholder="Ingrese su contraseña"
                                >
                            </td>
                        </tr>
                        <tr>
                            <th></th>
                            <td>
                                <input
                                type="submit"
                                value="iniciar sesión">
                            </td>
                        </tr>
                    </table>
                </form>
            </section>
        </main>
       
        
    </body>
</html>
