<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <link rel="shortcut icon"  href="Logo_Pub.png">
        <link rel="stylesheet" href="Estilo_Form.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="main.js" defer></script>
        <title>
            Umbrella Corps Botanics
        </title>
    </head>
    <body>
        <header>
            <h1>
                Umbrella Corps Botanics
            </h1>
        </header>
        <main>
            <section>
                <h2>
                    Crear cuenta en Umbrella Corps Botanics
                </h2>
                <form id="Form_Reg">
                    <table>
                        <tr>
                            <th>
                                Ingrese su nombre:
                            </th>
                            <td>
                                <input type="text" 
                                id="nombre"
                                name="nombre"
                                placeholder="Ingrese su nombre">
                            </td>
                        </tr>
                        <tr>
                            <th>
                                Ingrese su apellido:
                            </th>
                            <td>
                                <input type="text"
                                id="apellido"
                                name="apellido"
                                placeholder="Ingrese su apellido">
                            </td>
                        </tr>
                        <tr>
                            <th>
                                Ingrese su correo electrrónico:
                            </th>
                            <td>
                                <input type="email"
                                id="correo"
                                name="correo"
                                placeholder="ejemplo@dominio.com">
                            </td>
                        </tr>
                        <tr>
                            <th>
                                Ingrese una contraseña:
                            </th>
                            <td>
                                <input type="password"
                                id="contraseña"
                                name="contraseña"
                                placeholder="ingrese su contraseña">
                            </td>
                        </tr>
                        <tr>
                            <th>
                                Confirme su contraseña:
                            </th>
                            <td>
                                <input type="password"
                                id="confirmar_contraseña"
                                name="confirmar_contraseña"
                                placeholder="repita su contraseña">
                            </td>
                        </tr>
                        <tr>
                            <input type="submit"
                            value="crear cuenta">
                        </tr>
                    </table>
                </form>
                <p>
                    ¿ya tienes una cuenta?
                    <a href="longin.html">
                        Iniciar sesión
                    </a>
                </p>
                <a href="index.html">
                    Volver a Arklay Botanics
                </a>
            </section>
        </main>
    </body>
</html>
